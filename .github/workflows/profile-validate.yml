name: Profile integrity

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/profile/**
      - scripts/validate_profile.py
      - scripts/generate_visuals.py
      - scripts/generate_hero.py
      - requirements-dev.txt
      - .github/workflows/profile-validate.yml
  pull_request:
    paths:
      - README.md
      - assets/profile/**
      - scripts/validate_profile.py
      - scripts/generate_visuals.py
      - scripts/generate_hero.py
      - requirements-dev.txt
      - .github/workflows/profile-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check assets and links
        run: python scripts/validate_profile.py --require-logo
